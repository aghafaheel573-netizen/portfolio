<!DOCTYPE html>
<html>
<head>
    <title>Marks & Grade Check</title>
</head>
<body>
      <style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(to right, #667eea, #764ba2);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    .container {
        background: white;
        padding: 30px;
        border-radius: 15px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        text-align: center;
        width: 300px;
    }

    h2 {
        margin-bottom: 20px;
        color: #333;
    }

    input {
        width: 100%;
        padding: 10px;
        font-size: 16px;
        border: 1px solid #ccc;
        border-radius: 8px;
        margin-bottom: 15px;
        outline: none;
    }

    input:focus {
        border-color: #667eea;
    }

    button {
        width: 100%;
        padding: 10px;
        font-size: 16px;
        background: #667eea;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: 0.3s;
    }

    button:hover {
        background: #5a67d8;
    }

    #result {
        margin-top: 20px;
        font-size: 22px;
        font-weight: bold;
    }
</style>
    <div class="container">
    <h2>Enter your marks:</h2>
    <input type="number" id="marks">
    <button onclick="checkMarks()">Check</button>
    <h1 id="result"></h1>
</div>

    <script>
        function checkMarks() {
            let marks = document.getElementById("marks").value;
            if (marks < 0 || marks > 100 || isNaN (marks)) result.innerHTML="Invalid Input";
            result.style.color="blue";
        }

            if (marks >= 90) {
                document.getElementById("result").innerHTML = "Pass - Grade A+";
                result.style.color="orange";
            }
               else if (marks >= 80) {
                document.getElementById("result").innerHTML = "Pass - Grade A";
                result.style.color="red";
            } 
            else if (marks >= 60) {
                document.getElementById("result").innerHTML = "Pass - Grade B";
                result.style.color="green";
            } 
            else if (marks >= 40) {
                document.getElementById("result").innerHTML = "Pass - Grade C";
                result.style.color="pink";
            } 
            else {
                document.getElementById("result").innerHTML = "Fail";
                result.style.color="black";
            }
        
    </script>

</body>
</html>
